services:
  postgres:
    image: postgres:16
    container_name: fincore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fincore
      POSTGRES_PASSWORD: fincore_dev_password
      POSTGRES_DB: fincore
    ports:
      - "5432:5432"
    volumes:
      - fincore_pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincore -d fincore"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fincore-pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fincore.local
      PGADMIN_DEFAULT_PASSWORD: admin_dev_password
    ports:
      - "5050:80"
    volumes:
      - fincore_pgadmin_data:/var/lib/pgadmin

volumes:
  fincore_pg_data:
  fincore_pgadmin_data: